name: CI/CD Pipeline

on:
  push:
    branches: [ "Legal-AI-Assis", "main" ]
  pull_request:
    branches: [ "Legal-AI-Assis", "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
      with:
        lfs: true
        
    - name: Set up Python 3.12
      uses: actions/setup-python@v4
      with:
        python-version: "3.12"
        
    - name: Install uv
      run: curl -LsSf https://astral.sh/uv/install.sh | sh
      
    - name: Install dependencies
      run: |
        $HOME/.cargo/bin/uv pip install --system -r requirements.txt
        $HOME/.cargo/bin/uv pip install --system pytest pytest-asyncio black flake8 mypy
        
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 src api scripts --count --select=E9,F63,F7,F82 --show-source --statistics
        
    - name: Test with pytest
      run: |
        pytest tests/
