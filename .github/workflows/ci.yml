name: CI Pipeline

on:
  push:
    branches: [ main, master, Hr-agent-full-option ]
  pull_request:
    branches: [ main, master, Hr-agent-full-option ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: hr_admin
          POSTGRES_PASSWORD: paraline2026
          POSTGRES_DB: hr_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-asyncio pytest-cov httpx ruff

    - name: Lint with Ruff
      run: |
        ruff check .

    - name: Run Tests
      env:
        DATABASE_URL: postgresql://hr_admin:paraline2026@localhost:5432/hr_db
        REDIS_URL: redis://localhost:6379/0
        OFFLINE_MODE: "true"
      run: |
        pytest tests/ -v --cov=src --cov=api --cov-report=xml --cov-report=term

    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: coverage.xml
