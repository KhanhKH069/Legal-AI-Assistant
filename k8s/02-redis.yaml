apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  labels:
    app: hr-ai
    tier: cache
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hr-ai
      tier: cache
  template:
    metadata:
      labels:
        app: hr-ai
        tier: cache
    spec:
      containers:
      - name: redis
        image: redis:alpine
        command: ["redis-server", "--appendonly", "yes"]
        ports:
        - containerPort: 6379
        volumeMounts:
        - name: redis-data
          mountPath: /data
      volumes:
      - name: redis-data
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  labels:
    app: hr-ai
    tier: cache
spec:
  ports:
  - port: 6379
    targetPort: 6379
  selector:
    app: hr-ai
    tier: cache
