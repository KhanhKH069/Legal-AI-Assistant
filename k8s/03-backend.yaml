apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app: hr-ai
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hr-ai
      tier: backend
  template:
    metadata:
      labels:
        app: hr-ai
        tier: backend
    spec:
      containers:
      - name: backend
        image: hr-ai-backend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: hr-ai-config
        resources:
          requests:
            cpu: "500m"
            memory: "512Mi"
          limits:
            cpu: "1000m"
            memory: "1Gi"
        volumeMounts:
        - name: data-volume
          mountPath: /app/chroma_db
          subPath: chroma_db
        - name: data-volume
          mountPath: /app/documents
          subPath: documents
        - name: data-volume
          mountPath: /app/hr_database.db
          subPath: hr_database.db
      volumes:
      - name: data-volume
        persistentVolumeClaim:
          claimName: hr-ai-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  labels:
    app: hr-ai
    tier: backend
spec:
  type: NodePort
  ports:
  - port: 8000
    targetPort: 8000
    nodePort: 30000
  selector:
    app: hr-ai
    tier: backend
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend
  minReplicas: 2
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
