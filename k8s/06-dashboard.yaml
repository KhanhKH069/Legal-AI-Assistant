apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard
  labels:
    app: hr-ai
    tier: dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hr-ai
      tier: dashboard
  template:
    metadata:
      labels:
        app: hr-ai
        tier: dashboard
    spec:
      containers:
      - name: dashboard
        image: hr-ai-dashboard:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8501
        envFrom:
        - configMapRef:
            name: hr-ai-config
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: dashboard
  labels:
    app: hr-ai
    tier: dashboard
spec:
  type: LoadBalancer
  ports:
  - port: 8501
    targetPort: 8501
  selector:
    app: hr-ai
    tier: dashboard
