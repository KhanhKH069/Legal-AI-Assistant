apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app: hr-ai
    tier: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hr-ai
      tier: frontend
  template:
    metadata:
      labels:
        app: hr-ai
        tier: frontend
    spec:
      containers:
      - name: frontend
        image: hr-ai-frontend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
        envFrom:
        - configMapRef:
            name: hr-ai-config
        resources:
          requests:
            cpu: "200m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels:
    app: hr-ai
    tier: frontend
spec:
  type: LoadBalancer
  ports:
  - port: 3000
    targetPort: 3000
  selector:
    app: hr-ai
    tier: frontend
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: frontend-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: frontend
  minReplicas: 2
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
